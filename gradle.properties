# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=false
kotlin.code.style=official

# Force Android Studio full JBR (which includes jlink, javac, and full JDK tools)
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr
org.gradle.java.installations.paths=C:/Program Files/Android/Android Studio/jbr
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.from-environment=false